name: Validate native primitives sources
on:
  push:
    branches: [feat/harness-primitives]
    paths: ['src/**', 'tests/**', 'examples/**', 'benches/**', '.github/workflows/format-primitives.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: format-native-primitives
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'LIghtJUNction/zharness' && github.ref == 'refs/heads/feat/harness-primitives'
    runs-on: ubuntu-latest
    env:
      ZHARNESS_BENCH_SMOKE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
          rustup default 1.99.1
      - name: Format, compile and test native public interfaces
        run: |
          cargo fmt --all
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets --all-features -- -D warnings
          python scripts/examples.py
          python scripts/test_release.py
          python scripts/audit.py
      - name: Commit validated formatter output without overwriting other changes
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src tests examples benches
            git commit -m 'style: format validated native harness primitives'
            git push origin HEAD:refs/heads/feat/harness-primitives
          fi
      - name: Run strict cross-platform checks for the formatted head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref feat/harness-primitives
