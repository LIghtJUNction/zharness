name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [stable, "1.99.1"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal
          rustup default ${{ matrix.toolchain }}
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Format
        run: rustfmt --edition 2024 --check src/json.rs
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --all-targets --locked
      - name: Release tests
        run: cargo test --release --all-targets --locked
      - name: Run examples
        run: python -c "import subprocess; names=['basic','tool_registry','tool_execution','mcp_server','custom_transport','zcall_bridge']; [subprocess.run(['cargo','run','--example',n,'--locked'],check=True) for n in names]; subprocess.run(['cargo','run','--example','mcp_stdio','--locked'],input=b'',check=True)"
      - name: no_std check
        run: cargo check --no-default-features --locked
      - name: WASM no_std check
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        run: cargo check --target wasm32-unknown-unknown --no-default-features --locked
      - name: Dependency audit
        run: cargo tree --locked --edges normal --depth 1
      - name: Benchmark smoke
        run: cargo bench --bench dispatch --no-run --locked
      - name: Package
        run: cargo package --locked --no-verify
