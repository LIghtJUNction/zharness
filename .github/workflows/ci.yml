name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, '1.99.1']
    runs-on: ${{ matrix.os }}
    env:
      ZHARNESS_BENCH_SMOKE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy
          rustup default ${{ matrix.rust }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --all-targets --release
      - run: cargo test --locked --doc
      - run: python scripts/examples.py
      - run: python scripts/test_release.py
      - run: cargo check --locked --no-default-features
      - run: cargo run --locked --no-default-features --example skills
      - name: WASM no_std
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --locked --target wasm32-unknown-unknown --no-default-features
      - run: python scripts/audit.py
      - run: cargo bench --locked --benches
      - run: cargo package --locked
