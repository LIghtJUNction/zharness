name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (ignored when version is set)
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Optional exact SemVer version
        type: string
        default: ''
      publish:
        description: Publish after validation; false validates only
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'LIghtJUNction/zharness' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python scripts/test_release.py
      - id: plan
        env:
          BUMP: ${{ inputs.bump }}
          MANUAL_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: python scripts/release.py plan
  validate:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, '1.99.1']
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      ZHARNESS_BENCH_SMOKE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy
          rustup default ${{ matrix.rust }}
      - run: python scripts/release.py apply
      - name: Commit candidate locally for clean package verification
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then git commit -m "ci: validate $VERSION"; fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --all-targets --release
      - run: cargo test --locked --doc
      - run: cargo check --locked --no-default-features
      - run: python scripts/audit.py
      - name: Execute examples
        run: python -c "import subprocess; [subprocess.run(['cargo','run','--locked','--example',n],check=True) for n in ['basic','tool_registry','tool_execution','zcall_bridge']]"
      - name: WASM
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --locked --no-default-features --target wasm32-unknown-unknown
      - run: cargo package --locked
      - run: cargo publish --dry-run --locked
  publish:
    if: inputs.publish
    needs: [plan, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ZHARNESS_BENCH_SMOKE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: rustup default stable
      - run: python scripts/release.py apply
      - run: python scripts/release.py preflight
      - name: Commit verified version without publishing yet
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then git commit -m "release: v$VERSION"; fi
          test -z "$(git tag --list "v$VERSION")"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --release --all-targets
      - run: cargo test --locked --doc
      - run: python scripts/audit.py
      - run: cargo package --locked
      - run: cargo publish --dry-run --locked
      - name: Reject concurrent default-branch changes before registry publication
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          cargo publish --locked
      - name: Create tag only after publication succeeded
        run: |
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "refs/tags/v$VERSION"
      - name: Create GitHub Release without relying on another workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --verify-tag --generate-notes --title "v$VERSION"
