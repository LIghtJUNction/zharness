name: Composition and release evidence
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: composition-${{ github.ref }}
  cancel-in-progress: false
jobs:
  composition:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: LIghtJUNction/zmcp
          ref: 010fb64b0c73e8775f2828eb220f5eb1128a3af4
          path: integration/mcp/zmcp
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - run: cargo +1.99.1 run --locked --manifest-path integration/mcp/Cargo.toml
      - run: cargo +1.99.1 clippy --locked --manifest-path integration/mcp/Cargo.toml -- -D warnings
      - run: python scripts/test_release.py
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - name: Record reproducible environment and full benchmark
        run: |
          mkdir -p "$RUNNER_TEMP/zharness-evidence"
          {
            git rev-parse HEAD
            rustc +1.99.1 -Vv
            uname -a
            lscpu
          } > "$RUNNER_TEMP/zharness-evidence/environment.txt"
          cargo +1.99.1 bench --locked --bench dispatch > "$RUNNER_TEMP/zharness-evidence/benchmark.csv"
          cat "$RUNNER_TEMP/zharness-evidence/benchmark.csv"
          git archive --format=tar.gz -o "$RUNNER_TEMP/zharness-evidence/source.tar.gz" HEAD
      - name: Exercise version bump and package candidate without publishing
        env:
          VERSION: 0.1.1
          ZHARNESS_BENCH_SMOKE: '1'
        run: |
          rustup default 1.99.1
          python scripts/test_release.py
          python scripts/release.py apply
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then git commit -m 'ci: validate unpublished version bump'; fi
          cargo test --locked --release --all-targets
          python scripts/audit.py
          cargo package --locked
          cargo publish --dry-run --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zharness-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/zharness-evidence/
          if-no-files-found: error
          retention-days: 30
