name: Native harness evidence
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    env:
      ZHARNESS_BENCH_SMOKE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - name: Capture source, environment and full component benchmarks
        run: |
          mkdir -p "$RUNNER_TEMP/zharness-evidence"
          {
            git rev-parse HEAD
            rustc -Vv
            uname -a
            lscpu
          } > "$RUNNER_TEMP/zharness-evidence/environment.txt"
          unset ZHARNESS_BENCH_SMOKE
          cargo bench --locked --bench dispatch > "$RUNNER_TEMP/zharness-evidence/benchmark.csv"
          cargo bench --locked --bench output > "$RUNNER_TEMP/zharness-evidence/output-benchmark.csv"
          cargo bench --locked --bench execution > "$RUNNER_TEMP/zharness-evidence/execution-benchmark.csv"
          cargo bench --locked --bench lifecycle > "$RUNNER_TEMP/zharness-evidence/lifecycle-benchmark.csv"
          cargo bench --locked --bench skills > "$RUNNER_TEMP/zharness-evidence/skills-benchmark.csv"
          cargo bench --locked --bench plugins > "$RUNNER_TEMP/zharness-evidence/plugins-benchmark.csv"
          cat "$RUNNER_TEMP/zharness-evidence/lifecycle-benchmark.csv"
          git archive --format=tar.gz -o "$RUNNER_TEMP/zharness-evidence/source.tar.gz" HEAD
      - name: Preserve unmodified source test evidence
        run: |
          set -euo pipefail
          cargo test --locked --lib --tests -- --test-threads=1 | tee "$RUNNER_TEMP/zharness-evidence/tests.txt"
          cargo test --locked --doc | tee "$RUNNER_TEMP/zharness-evidence/doctests.txt"
          python scripts/examples.py
          python scripts/test_release.py
      - id: candidate
        env:
          BUMP: patch
          PUBLISH: 'false'
        run: python scripts/release.py plan
      - name: Validate the next candidate without publishing
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          python scripts/release.py apply
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then git commit -m 'ci: validate unpublished candidate'; fi
          cargo test --locked --release --all-targets
          python scripts/audit.py
          cargo package --locked
          cargo publish --dry-run --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zharness-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/zharness-evidence/
          if-no-files-found: error
          retention-days: 30
