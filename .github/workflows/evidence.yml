name: Harness performance evidence
on:
  push:
    branches: [main]
    paths-ignore: [.github/release-request.json]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ZHARNESS_BENCH_SMOKE: '1'
      RUSTUP_TOOLCHAIN: stable
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup target add wasm32-unknown-unknown
      - name: Capture source, environment and full component benchmarks
        run: |
          mkdir -p "$RUNNER_TEMP/zharness-evidence"
          {
            git rev-parse HEAD
            rustc -Vv
            uname -a
            lscpu
          } > "$RUNNER_TEMP/zharness-evidence/environment.txt"
          unset ZHARNESS_BENCH_SMOKE
          cargo bench --locked --bench dispatch > "$RUNNER_TEMP/zharness-evidence/benchmark.csv"
          cargo bench --locked --bench output > "$RUNNER_TEMP/zharness-evidence/output-benchmark.csv"
          cargo bench --locked --bench execution > "$RUNNER_TEMP/zharness-evidence/execution-benchmark.csv"
          cargo bench --locked --bench lifecycle > "$RUNNER_TEMP/zharness-evidence/lifecycle-benchmark.csv"
          cargo bench --locked --bench skills > "$RUNNER_TEMP/zharness-evidence/skills-benchmark.csv"
          cargo bench --locked --bench plugins > "$RUNNER_TEMP/zharness-evidence/plugins-benchmark.csv"
          python scripts/wasm_bench.py --output "$RUNNER_TEMP/zharness-evidence/wasm"
          cat "$RUNNER_TEMP/zharness-evidence/lifecycle-benchmark.csv"
          git archive --format=tar.gz -o "$RUNNER_TEMP/zharness-evidence/source.tar.gz" HEAD
      - name: Preserve unmodified source test evidence
        run: |
          set -euo pipefail
          cargo test --locked --all-features --lib --tests -- --test-threads=1 | tee "$RUNNER_TEMP/zharness-evidence/tests.txt"
          cargo test --locked --all-features --doc | tee "$RUNNER_TEMP/zharness-evidence/doctests.txt"
          python scripts/examples.py
          python scripts/wasm.py
          python -m unittest discover -s scripts -p 'test_*.py' -v
      - id: candidate
        run: python scripts/release.py plan --bump patch --dry-run true
      - name: Validate the next candidate without publishing
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          cargo test --locked --release --all-targets --all-features
          python scripts/audit.py
          python scripts/release.py packages --version "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zharness-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/zharness-evidence/
          if-no-files-found: error
          retention-days: 30
