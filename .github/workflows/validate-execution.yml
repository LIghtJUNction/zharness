name: Validate execution hook sources
on:
  push:
    branches: [feat/execution-hooks]
    paths: ['src/**', 'tests/**', 'examples/**', 'benches/**', '.github/workflows/validate-execution.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: validate-execution-sources
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'LIghtJUNction/zharness' && github.ref == 'refs/heads/feat/execution-hooks'
    runs-on: ubuntu-latest
    env:
      ZHARNESS_BENCH_SMOKE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
          rustup default 1.99.1
      - name: Validate formatted sources and behavior
        run: |
          cargo fmt --all
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --doc
          python scripts/examples.py
          python scripts/audit.py
      - name: Push formatter output without overwriting concurrent work
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src tests examples benches
            git commit -m 'style: format validated execution hook sources'
            git push origin HEAD:refs/heads/feat/execution-hooks
          fi
      - name: Verify formatted head on supported platforms
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref feat/execution-hooks
