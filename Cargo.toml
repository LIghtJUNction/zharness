[package]
name = "zharness"
version = "0.3.0"
edition = "2024"
rust-version = "1.99.1"
description = "Caller-buffered context, tool-loop, hook and multi-agent harness primitives"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LIghtJUNction/zharness"
readme = "README.md"
keywords = ["ai", "harness", "tool-calling", "agents", "no-std"]
categories = ["api-bindings", "development-tools"]
include = ["src/**", "tests/**", "examples/**", "benches/**", "scripts/*.py", "docs/**", "*.md", "LICENSE-*", "Cargo.toml", "Cargo.lock"]

[dependencies]
zcall = { version = "=0.2.0", default-features = false }
zplugin = { version = "=0.3.0", default-features = false, features = ["macros"] }

[features]
default = ["std"]
std = ["zplugin/std"]
wasm = ["zplugin/wasm"]

[dev-dependencies]

[build-dependencies]

[workspace]
members = ["."]
exclude = ["comparison"]

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1

[[bench]]
name = "dispatch"
harness = false

[[bench]]
name = "output"
harness = false

[[bench]]
name = "execution"
harness = false

[[bench]]
name = "lifecycle"
harness = false

[[bench]]
name = "skills"
harness = false

[[bench]]
name = "plugins"
harness = false
required-features = ["std"]

[[bench]]
name = "wasm_plugins"
harness = false
required-features = ["std", "wasm"]

[[example]]
name = "native_plugin"
crate-type = ["cdylib"]
test = false
required-features = ["std"]

[[example]]
name = "plugin_fixture"
path = "tests/fixtures/native_plugin.rs"
crate-type = ["cdylib"]
test = false
required-features = ["std"]

[[example]]
name = "plugin_host"
required-features = ["std"]

[[example]]
name = "wasm_host"
required-features = ["std", "wasm"]

[[example]]
name = "mixed_plugin_host"
required-features = ["std", "wasm"]
