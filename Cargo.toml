[package]
name = "zharness"
version = "0.2.2"
edition = "2024"
rust-version = "1.99.1"
description = "Caller-buffered context, tool-loop, hook and multi-agent harness primitives"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LIghtJUNction/zharness"
readme = "README.md"
keywords = ["ai", "harness", "tool-calling", "agents", "no-std"]
categories = ["api-bindings", "development-tools"]
include = ["src/**", "tests/**", "examples/**", "benches/**", "docs/**", "*.md", "LICENSE-*", "Cargo.toml", "Cargo.lock"]

[dependencies]
zcall = { version = "=0.1.2", default-features = false }

[features]
default = ["std"]
std = []

[dev-dependencies]

[build-dependencies]

[workspace]
members = ["."]
exclude = ["comparison"]

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1

[[bench]]
name = "dispatch"
harness = false

[[bench]]
name = "output"
harness = false

[[bench]]
name = "execution"
harness = false
